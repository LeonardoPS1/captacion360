server {
    listen 80;
    server_name captacion360.aicorebots.com;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Páginas HTML: sin caché agresiva, para que las actualizaciones se vean al instante
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Cualquier otro estático (si se agregan imágenes/assets a futuro)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /index.html;
}
