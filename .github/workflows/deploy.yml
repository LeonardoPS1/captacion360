name: Deploy to Dokploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Dokploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -n "$DOKPLOY_API_KEY" ]; then
            curl -X POST \
              -H "Authorization: Bearer $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"source": "github", "branch": "main"}' \
              https://dokploy.aicorebots.com/api/v1/apps/T1RV3i1aaeovQHfD1N7RZ/deploy
          else
            echo "⚠️ DOKPLOY_API_KEY no está definido, saltando deploy"
            exit 1
          fi

      - name: Verify deployment
        if: always()
        run: |
          echo "✅ Deployment workflow completed"
          echo "Check the Dokploy dashboard for deployment status"