name: Deploy captacion360

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/captacion360:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/captacion360:${{ github.sha }}

      - name: Deploy to Dokploy
        if: secrets.DOKPLOY_API_KEY != ''
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"image": "${{ secrets.DOCKERHUB_USERNAME }}/captacion360:latest"}' \
            https://api.dokploy.com/v1/apps/captacion360-cap360-86ynna/deploy
        working-directory: D:\AGENCIA MARKETING DIGITAL\captacion360

      - name: Verify deployment
        if: always()
        run: |
          echo "✅ Deployment workflow completed"
          echo "Check the Dokploy dashboard for deployment status"