name: Deploy to Dokploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Dokploy
        run: |
          if [ -n "${{ secrets.DOKPLOY_API_KEY }}" ]; then
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.DOKPLOY_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"source": "github", "branch": "main"}' \
              https://api.dokploy.com/v1/apps/captacion360-cap360-86ynna/deploy
          else
            echo "⚠️ DOKPLOY_API_KEY no está definido, saltando deploy"
          fi
        working-directory: D:\AGENCIA MARKETING DIGITAL\captacion360

      - name: Verify deployment
        if: always()
        run: |
          echo "✅ Deployment workflow completed"
          echo "Check the Dokploy dashboard for deployment status"